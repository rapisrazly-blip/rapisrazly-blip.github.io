<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロンプトギャラリー 500選 — RAPIS</title>
<meta name="description" content="画像生成AI向けプロンプト500選。50カテゴリーに整理したコピペ用プロンプト集。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23010828'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='900' fill='%236FFF00' text-anchor='middle'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --c-bg:      #010828;
    --c-surface: #0a0c14;
    --c-card:    #0d1430;
    --c-fg:      #EFF4FF;
    --c-muted:   rgba(239,244,255,0.45);
    --c-border:  rgba(239,244,255,0.10);
    --c-accent:  #6FFF00;
    --r-sm: 0.5rem;
    --r-md: 0.875rem;
    --r-lg: 1.25rem;
    --r-pill: 9999px;
    --f-display: 'Syne', 'Hiragino Kaku Gothic ProN', sans-serif;
    --f-mono: 'JetBrains Mono', monospace;
    --f-body: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--f-body);
    background: var(--c-bg);
    color: var(--c-fg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ── Header ── */
  .top {
    position: sticky; top: 0; z-index: 50;
    background: rgba(1,8,40,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--c-border);
  }
  .top-inner {
    max-width: 1180px; margin: 0 auto;
    padding: 0.9rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .back {
    font-family: var(--f-mono); font-size: 0.78rem;
    color: var(--c-muted); display: inline-flex; align-items: center; gap: 0.4rem;
    transition: color 0.2s;
  }
  .back:hover { color: var(--c-accent); }
  .brand { font-family: var(--f-display); font-weight: 800; letter-spacing: 0.02em; font-size: 1rem; }
  .brand span { color: var(--c-accent); }

  /* ── Hero ── */
  .hero {
    max-width: 1180px; margin: 0 auto;
    padding: 3.5rem 1.5rem 2rem;
    text-align: center;
  }
  .hero .label {
    font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--c-accent); margin-bottom: 1rem;
  }
  .hero h1 {
    font-family: var(--f-display); font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.1; letter-spacing: -0.01em;
  }
  .hero h1 em { font-style: normal; color: var(--c-accent); }
  .hero p { color: var(--c-muted); margin-top: 1rem; font-size: 0.95rem; }

  /* ── Controls ── */
  .controls {
    position: sticky; top: 56px; z-index: 40;
    background: rgba(1,8,40,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--c-border);
    padding: 0.9rem 0;
  }
  .controls-inner { max-width: 1180px; margin: 0 auto; padding: 0 1.5rem; }
  .search-wrap { position: relative; margin-bottom: 0.85rem; }
  .search {
    width: 100%; padding: 0.7rem 1rem 0.7rem 2.4rem;
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: var(--r-pill); color: var(--c-fg);
    font-family: var(--f-body); font-size: 0.9rem; outline: none;
    transition: border-color 0.2s;
  }
  .search:focus { border-color: var(--c-accent); }
  .search::placeholder { color: var(--c-muted); }
  .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--c-muted); pointer-events: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; max-height: 5.6rem; overflow-y: auto; padding-bottom: 0.2rem; }
  .chips::-webkit-scrollbar { height: 6px; width: 6px; }
  .chips::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }
  .chip {
    font-family: var(--f-mono); font-size: 0.72rem;
    padding: 0.32rem 0.7rem; border-radius: var(--r-pill);
    background: var(--c-surface); border: 1px solid var(--c-border);
    color: var(--c-muted); cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  .chip:hover { color: var(--c-fg); border-color: var(--c-muted); }
  .chip.active { background: var(--c-accent); color: #010828; border-color: var(--c-accent); font-weight: 500; }
  .chip .n { opacity: 0.6; margin-left: 0.3rem; }
  .chip.active .n { opacity: 0.7; }

  /* ── Grid ── */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }
  .count-line { font-family: var(--f-mono); font-size: 0.78rem; color: var(--c-muted); margin-bottom: 1.2rem; }
  .count-line b { color: var(--c-accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }

  .card {
    background: var(--c-card); border: 1px solid var(--c-border);
    border-radius: var(--r-lg); padding: 1.25rem; display: flex; flex-direction: column;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: rgba(111,255,0,0.35); transform: translateY(-2px); }
  .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.75rem; }
  .card-id { font-family: var(--f-mono); font-size: 0.72rem; color: var(--c-accent); font-weight: 500; }
  .card-cat { font-family: var(--f-mono); font-size: 0.65rem; color: var(--c-muted); text-align: right; }
  .card-prompt { font-size: 0.92rem; line-height: 1.75; margin-bottom: 1rem; flex: 1; }
  .card-prompt .br { color: var(--c-accent); font-weight: 600; }
  .supp { border-top: 1px solid var(--c-border); padding-top: 0.8rem; margin-bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .supp-row { display: flex; gap: 0.55rem; font-size: 0.74rem; line-height: 1.55; }
  .supp-lbl { flex-shrink: 0; font-family: var(--f-mono); font-size: 0.64rem; color: var(--c-accent); padding-top: 0.12rem; min-width: 2.4em; }
  .supp-txt { color: var(--c-muted); }
  .btn-copy {
    font-family: var(--f-display); font-weight: 600; font-size: 0.82rem;
    padding: 0.6rem; border: 1px solid var(--c-border); border-radius: var(--r-md);
    background: transparent; color: var(--c-fg); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.45rem;
    transition: all 0.15s;
  }
  .btn-copy:hover { background: var(--c-accent); color: #010828; border-color: var(--c-accent); }
  .btn-copy.done { background: var(--c-accent); color: #010828; border-color: var(--c-accent); }

  .empty { text-align: center; color: var(--c-muted); padding: 4rem 1rem; font-family: var(--f-mono); font-size: 0.85rem; }

  footer { border-top: 1px solid var(--c-border); padding: 2rem 1.5rem; text-align: center; color: var(--c-muted); font-family: var(--f-mono); font-size: 0.72rem; }

  @media (max-width: 560px) {
    .hero { padding-top: 2.5rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="back" href="../index.html">&larr; ホームに戻る</a>
    <div class="brand">RAPIS<span>.</span></div>
  </div>
</header>

<section class="hero">
  <div class="label">Prompt Gallery</div>
  <h1>プロンプト<em>500</em>選</h1>
  <p>画像生成AI向けのプロンプト集。<br>カテゴリーで絞り込み、ワンクリックでコピー。</p>
</section>

<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input class="search" id="search" type="text" placeholder="キーワードで検索（例：韓国、高級感、LP）">
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap">
  <div class="count-line" id="countLine"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">該当するプロンプトが見つかりませんでした。</div>
</main>

<footer>
  500 prompts &middot; 50 categories &middot; rapisrazly
</footer>

<script>
const COPY_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';

let DATA = [];
let activeCat = 'ALL';
let keyword = '';

const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const countLine = document.getElementById('countLine');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 【　　】部分をアクセント表示にする
function renderPrompt(text){
  const esc = escapeHtml(text);
  return esc.replace(/(【[\s　]*】)/g, '<span class="br">$1</span>');
}

function buildChips(){
  const cats = [];
  DATA.forEach(d => { if(!cats.includes(d.cat)) cats.push(d.cat); });
  const counts = {};
  DATA.forEach(d => { counts[d.cat] = (counts[d.cat]||0)+1; });

  let html = `<button class="chip active" data-cat="ALL">すべて<span class="n">${DATA.length}</span></button>`;
  cats.forEach(c => {
    html += `<button class="chip" data-cat="${escapeHtml(c)}">${escapeHtml(c)}<span class="n">${counts[c]}</span></button>`;
  });
  chipsEl.innerHTML = html;
  chipsEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      chipsEl.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
}

function getFiltered(){
  return DATA.filter(d => {
    if(activeCat !== 'ALL' && d.cat !== activeCat) return false;
    if(keyword){
      const hay = (d.prompt + d.feat + d.use + d.cat).toLowerCase();
      if(!hay.includes(keyword)) return false;
    }
    return true;
  });
}

function render(){
  const items = getFiltered();
  countLine.innerHTML = `<b>${items.length}</b> 件のプロンプト`;
  if(items.length === 0){
    grid.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  grid.innerHTML = items.map(d => `
    <div class="card">
      <div class="card-meta">
        <span class="card-id">${escapeHtml(d.id)}</span>
        <span class="card-cat">${escapeHtml(d.cat)}</span>
      </div>
      <div class="card-prompt">${renderPrompt(d.prompt)}</div>
      <div class="supp">
        <div class="supp-row"><span class="supp-lbl">特徴</span><span class="supp-txt">${escapeHtml(d.feat)}</span></div>
        <div class="supp-row"><span class="supp-lbl">用途</span><span class="supp-txt">${escapeHtml(d.use)}</span></div>
      </div>
      <button class="btn-copy" data-prompt="${escapeHtml(d.prompt)}">${COPY_SVG}<span>プロンプトをコピー</span></button>
    </div>
  `).join('');

  grid.querySelectorAll('.btn-copy').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.prompt);
      } catch(e) {
        const ta = document.createElement('textarea');
        ta.value = btn.dataset.prompt; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      btn.classList.add('done');
      btn.innerHTML = CHECK_SVG + '<span>コピーしました</span>';
      setTimeout(() => {
        btn.classList.remove('done');
        btn.innerHTML = COPY_SVG + '<span>プロンプトをコピー</span>';
      }, 1400);
    });
  });
}

let searchTimer;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { keyword = searchEl.value.trim().toLowerCase(); render(); }, 150);
});

fetch('./data/prompts.json')
  .then(r => r.json())
  .then(json => { DATA = json; buildChips(); render(); })
  .catch(err => {
    countLine.textContent = '';
    emptyEl.textContent = 'データの読み込みに失敗しました: ' + err;
    emptyEl.style.display = 'block';
  });
</script>
</body>
</html>
