<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>見えなかった仕事を言葉にする診断</title>
  <style>
    :root {
      --paper: #eef1f2;
      --paper-deep: #dbe1e5;
      --ink: #1c2b35;
      --muted: #64737d;
      --line: #aebbc3;
      --navy: #193c52;
      --amber: #c88a2a;
      --amber-light: #f5e6c8;
      --white: #ffffff;
      --danger: #9e3e32;
      --radius: 4px;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.8;
      letter-spacing: .025em;
    }
    html[lang="en"] body {
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      letter-spacing: 0;
    }
    button, textarea, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #28698c; outline-offset: 3px; }

    .page {
      width: min(100% - 32px, 1040px);
      margin: 0 auto;
      padding: 26px 0 72px;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 14px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }
    .masthead .meta { color: var(--muted); font-weight: 500; }
    .masthead .right { display: flex; align-items: center; gap: 14px; }
    .lang-toggle {
      border: 1px solid var(--navy);
      border-radius: 2px;
      padding: 5px 13px;
      background: transparent;
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .lang-toggle:hover { background: var(--navy); color: var(--white); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(250px, .6fr);
      gap: 48px;
      padding: 76px 0 58px;
      border-bottom: 1px solid var(--line);
    }
    .hero h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(36px, 6vw, 66px);
      font-weight: 500;
      letter-spacing: .04em;
      line-height: 1.25;
    }
    html[lang="en"] .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5.4vw, 60px);
      letter-spacing: 0;
      line-height: 1.16;
    }
    .hero p { max-width: 39em; margin: 25px 0 0; color: #40515c; }
    .stamp {
      align-self: end;
      border-left: 5px solid var(--amber);
      padding: 11px 0 11px 18px;
      color: var(--navy);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.55;
    }
    .note {
      margin: 28px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .workspace { padding-top: 42px; }
    .section-title {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin: 0 0 24px;
      font-size: 16px;
    }
    .section-title b { color: var(--amber); font-size: 13px; letter-spacing: .08em; }
    .progress {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      margin-bottom: 38px;
    }
    .progress span { height: 5px; background: var(--paper-deep); }
    .progress span.active { background: var(--amber); }
    .question-shell { max-width: 820px; }
    .question-number { color: var(--amber); font-size: 13px; font-weight: 700; }
    .question-shell h2 {
      margin: 6px 0 9px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(25px, 4vw, 37px);
      font-weight: 500;
      line-height: 1.5;
    }
    html[lang="en"] .question-shell h2 { font-family: Georgia, "Times New Roman", serif; line-height: 1.32; }
    .question-help { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 196px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      background: rgba(255,255,255,.76);
      color: var(--ink);
      line-height: 1.85;
    }
    textarea::placeholder { color: #8a989f; }
    textarea.compact { min-height: 112px; }
    .field-note { display: flex; justify-content: space-between; gap: 12px; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .button {
      border: 1px solid var(--navy);
      border-radius: 2px;
      padding: 12px 23px;
      background: transparent;
      color: var(--navy);
      font-weight: 700;
    }
    .button:hover { background: #e0e8eb; }
    .button.primary { background: var(--navy); color: var(--white); }
    .button.primary:hover { background: #0e2c3e; }
    .button.ghost { border-color: transparent; color: var(--muted); }
    .button.copy { border-color: var(--amber); color: #805414; }
    .button.copy:hover { background: var(--amber-light); }
    .button.small { padding: 9px 16px; font-size: 14px; }
    .validation { min-height: 1.8em; margin: 12px 0 0; color: var(--danger); font-size: 14px; }

    .option-list { display: grid; gap: 12px; }
    .option {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 17px 20px;
      background: rgba(255,255,255,.7);
      color: var(--ink);
      font-weight: 400;
      line-height: 1.75;
    }
    .option:hover { border-color: var(--navy); background: var(--white); }
    .option.selected { border: 2px solid var(--navy); background: var(--white); padding: 16px 19px; }
    .option b { display: block; color: var(--navy); font-size: 16px; margin-bottom: 4px; }
    .option span { font-size: 14px; color: #45565f; }
    .option-extra { margin-top: 16px; }
    .option-extra.hidden { display: none; }

    .result { display: none; max-width: 920px; }
    .result.visible { display: block; }
    .form-flow.hidden { display: none; }
    .result-head { border-bottom: 2px solid var(--ink); padding-bottom: 28px; margin-bottom: 38px; }
    .result-head .eyebrow { color: var(--amber); font-size: 13px; font-weight: 700; }
    .result-head h2 { margin: 9px 0 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: clamp(30px, 5vw, 49px); font-weight: 500; line-height: 1.38; }
    html[lang="en"] .result-head h2 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; }
    .result-head p { margin: 16px 0 0; color: var(--muted); }
    .result-block { padding: 0 0 34px; margin-bottom: 34px; border-bottom: 1px solid var(--line); }
    .result-block h3 { margin: 0 0 15px; color: var(--navy); font-size: 21px; }
    .result-block > p { margin: 0 0 15px; }
    .result-block ul { padding-left: 1.3em; margin: 12px 0; }
    .block-lead { color: var(--muted); font-size: 14px; }

    .power-card {
      border-left: 4px solid var(--navy);
      background: rgba(255,255,255,.66);
      padding: 20px 22px;
      margin-bottom: 16px;
    }
    .power-card h4 { margin: 0 0 8px; color: var(--navy); font-size: 18px; }
    .power-card p { margin: 0; }
    .power-card .basis { display: block; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); color: #4d5d66; font-size: 13px; }
    .power-card .basis b { color: var(--navy); font-size: 12px; }

    .recheck { margin-top: 22px; padding: 18px 20px; background: rgba(255,255,255,.55); border: 1px dashed var(--line); }
    .recheck p { margin: 0 0 12px; font-size: 14px; color: #45565f; }
    .recheck .form-actions { margin-top: 0; }

    .reframe { display: grid; gap: 0; border: 1px solid var(--line); background: rgba(255,255,255,.66); }
    .reframe > div { padding: 20px 22px; }
    .reframe .before { border-bottom: 3px solid var(--amber); }
    .reframe .label { display: block; color: var(--amber); font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .reframe .before .label { color: var(--muted); }
    .reframe .before p { margin: 0; color: #4d5d66; }
    .reframe .after p { margin: 0; font-size: 17px; line-height: 1.85; }
    .reframe .after .tail { margin-top: 12px; font-size: 14px; color: #45565f; }

    .switch-box { padding: 20px 22px; background: var(--amber-light); border-left: 4px solid var(--amber); }
    .switch-box p { margin: 0 0 10px; }
    .switch-box p:last-child { margin: 0; }
    .switch-box b { color: #7a4f13; }

    .copy-card { border: 1px solid var(--line); background: rgba(255,255,255,.7); margin-bottom: 18px; }
    .copy-card .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.5); }
    .copy-card .head b { color: var(--navy); font-size: 15px; }
    .copy-card .body { padding: 20px 22px; line-height: 1.95; white-space: pre-wrap; }

    .action-grid { display: grid; gap: 12px; margin-bottom: 20px; }
    .time-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; font-size: 14px; }
    .time-row select { border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; background: var(--white); color: var(--ink); }
    .pledge { padding: 22px; background: var(--navy); color: var(--white); font-size: 18px; line-height: 1.85; }
    .pledge.hidden { display: none; }
    .draft-box { margin-top: 16px; }
    .draft-box.hidden { display: none; }
    .draft-box > p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }

    .prompt-block { background: #e5ebed; padding: 30px; border-top: 5px solid var(--amber); }
    .prompt-block h3 { margin: 0 0 8px; color: var(--navy); font-size: 22px; }
    .prompt-block p { margin: 0 0 18px; font-size: 14px; color: #43535c; }
    .prompt-output {
      width: 100%;
      min-height: 440px;
      background: var(--white);
      font-size: 14px;
      line-height: 1.75;
    }
    .privacy { padding-top: 26px; color: var(--muted); font-size: 13px; }
    .toast { min-height: 1.8em; margin: 10px 0 0; color: #386834; font-size: 14px; font-weight: 700; }

    @media (max-width: 700px) {
      .page { width: min(100% - 24px, 1040px); padding-top: 18px; }
      .masthead .meta { display: none; }
      .hero { grid-template-columns: 1fr; gap: 28px; padding: 48px 0 42px; }
      .stamp { align-self: start; }
      .workspace { padding-top: 30px; }
      .question-shell h2 { line-height: 1.45; }
      .button { width: 100%; }
      .form-actions { flex-direction: column-reverse; }
      .progress { gap: 3px; }
      .prompt-block { margin-left: -12px; margin-right: -12px; padding: 23px 18px; }
      .copy-card .head { flex-direction: column; align-items: flex-start; }
      .copy-card .head .button { width: 100%; }
      .time-row select { width: 100%; }
      .lang-toggle { width: auto; }
    }
    @media (prefers-reduced-motion: no-preference) { .question-shell, .result-head { animation: appear .28s ease both; } @keyframes appear { from { opacity: .2; transform: translateY(5px); } to { opacity: 1; transform: none; } } }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <span id="mastTitle">見えなかった仕事を言葉にする診断</span>
      <span class="right">
        <span class="meta" id="mastMeta">試作版 / 回答はこのブラウザ内だけで扱います</span>
        <button type="button" class="lang-toggle" id="langToggle">English</button>
      </span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title"></h1>
        <p id="heroLead"></p>
      </div>
      <div class="stamp" id="heroStamp"></div>
    </section>

    <section class="workspace" aria-live="polite">
      <div class="form-flow" id="formFlow">
        <p class="section-title"><b id="flowLabel"></b><span id="stepName"></span></p>
        <div class="progress" id="progress"></div>
        <div class="question-shell">
          <p class="question-number" id="questionNumber"></p>
          <h2 id="questionText"></h2>
          <p class="question-help" id="questionHelp"></p>

          <div id="textPane">
            <label for="answer" class="sr-only" style="position:absolute;clip:rect(0,0,0,0)">answer</label>
            <textarea id="answer" maxlength="800" aria-describedby="fieldNote"></textarea>
            <div class="field-note" id="fieldNote"><span id="fieldHint"></span><span id="charCount">0 / 800</span></div>
          </div>

          <div id="choicePane" hidden>
            <div class="option-list" id="optionList"></div>
            <div class="option-extra hidden" id="optionExtra">
              <label for="extraText" class="sr-only" style="position:absolute;clip:rect(0,0,0,0)">your own words</label>
              <textarea id="extraText" class="compact" maxlength="300"></textarea>
            </div>
          </div>

          <p class="validation" id="validation"></p>
          <div class="form-actions">
            <button type="button" class="button ghost" id="backButton"></button>
            <button type="button" class="button primary" id="nextButton"></button>
          </div>
        </div>
        <p class="note" id="flowNote"></p>
      </div>

      <section class="result" id="result" aria-labelledby="resultTitle">
        <div class="result-head">
          <p class="eyebrow" id="resultEyebrow"></p>
          <h2 id="resultTitle"></h2>
          <p id="resultLead"></p>
        </div>

        <article class="result-block">
          <h3 id="powerHead"></h3>
          <p class="block-lead" id="powerLead"></p>
          <div id="powerList"></div>
          <div class="recheck">
            <p id="recheckText"></p>
            <div class="form-actions">
              <button type="button" class="button small" id="flipSource"></button>
              <button type="button" class="button small" id="flipStyle"></button>
              <button type="button" class="button small" id="flipField"></button>
            </div>
          </div>
        </article>

        <article class="result-block">
          <h3 id="reframeHead"></h3>
          <p class="block-lead" id="reframeLead"></p>
          <div class="reframe">
            <div class="before"><span class="label" id="reframeBeforeLabel"></span><p id="reframeBefore"></p></div>
            <div class="after"><span class="label" id="reframeAfterLabel"></span><p id="reframeAfter"></p><p class="tail" id="reframeTail"></p></div>
          </div>
        </article>

        <article class="result-block">
          <h3 id="switchHead"></h3>
          <p class="block-lead" id="switchLead"></p>
          <div class="switch-box">
            <p id="switchOn"></p>
            <p id="switchOff"></p>
          </div>
        </article>

        <article class="result-block">
          <h3 id="copyHead"></h3>
          <p class="block-lead" id="copyLead"></p>
          <div class="copy-card">
            <div class="head"><b id="copyApplyLabel"></b><button type="button" class="button copy small" data-copy="copyApply"></button></div>
            <div class="body" id="copyApply"></div>
          </div>
          <div class="copy-card">
            <div class="head"><b id="copyProfileLabel"></b><button type="button" class="button copy small" data-copy="copyProfile"></button></div>
            <div class="body" id="copyProfile"></div>
          </div>
          <p class="toast" id="toastCopy" role="status"></p>
        </article>

        <article class="result-block">
          <h3 id="actionHead"></h3>
          <p class="block-lead" id="actionLead"></p>
          <div class="action-grid" id="actionList"></div>
          <div class="time-row">
            <label for="actionTime" id="actionTimeLabel"></label>
            <select id="actionTime"></select>
          </div>
          <p class="pledge hidden" id="pledge"></p>
          <div class="draft-box hidden" id="draftBox">
            <p id="draftLead"></p>
            <div class="copy-card">
              <div class="head"><b id="draftLabel"></b><button type="button" class="button copy small" data-copy="draftBody"></button></div>
              <div class="body" id="draftBody"></div>
            </div>
          </div>
        </article>

        <section class="prompt-block" aria-labelledby="promptTitle">
          <h3 id="promptTitle"></h3>
          <p id="promptLead"></p>
          <textarea class="prompt-output" id="promptOutput" readonly aria-label="prompt"></textarea>
          <button type="button" class="button copy" id="copyButton"></button>
          <p class="toast" id="toast" role="status"></p>
        </section>

        <p class="privacy" id="privacyNote"></p>
        <div class="form-actions"><button type="button" class="button" id="editButton"></button><button type="button" class="button ghost" id="restartButton"></button></div>
      </section>
    </section>
  </main>

  <script>
  (function () {
    "use strict";

    var byId = function (id) { return document.getElementById(id); };

    /* =========================================================
       語彙辞書：回答から軸へ点を入れる（言語ごとに別の辞書）
       ========================================================= */
    var LEX = {
      ja: {
        needed:  /人|客|仲間|後輩|新人|部下|同僚|上司|頼ら|頼まれ|相談|感謝|喜|助け|支え|チーム|店|接客|声をかけ|話を聞/g,
        control: /自分で|自分が|判断|決め|任さ|任せ|裁量|段取|工夫|改善|効率|管理|仕切|回し|組み立て|考えて/g,
        endure:  /続け|毎日|同じ|黙々|淡々|我慢|耐え|こなし|繰り返|欠かさ|休まず|辞めな|遅刻|遅れず|何年|年間/g,
        arrange: /準備|先に|前もって|整え|仕組|手順|メモ|記録|片付|並べ|揃え|確認|見直|予測|気付|気づ|備え|用意/g,
        rough:   /怒鳴|クレーム|トラブル|理不尽|急|深夜|炎天|寒|暑|重い|危険|汚|酔|揉め|喧嘩|怒ら|無茶|残業|夜中/g,
        precise: /正確|ミス|ずれ|数字|チェック|検品|品質|丁寧|細か|静か|一人|黙|間違|抜け|漏れ|合わせ/g
      },
      en: {
        needed:  /people|person|customer|client|guest|team|junior|newcomer|new hire|staff|co-?worker|colleague|asked me|rely|relied|help|support|listen|cover(ed)? for/gi,
        control: /decide|decided|decision|my own|judg(e)?ment|in charge|manage|organi[sz]e|ran |run |handle|figure(d)? out|sort(ed)? out|call the shot/gi,
        endure:  /every day|daily|same|keep|kept|routine|repeat|never miss|show(ed)? up|steady|stick|stuck|put up with|endure|year(s)?|shift after shift/gi,
        arrange: /prepare|prepared|ahead|in advance|set up|checklist|note|tidy|arrange|double.?check|anticipate|before.*(ask|happen)|ready/gi,
        rough:   /yell|shout|complaint|angry|unfair|rush|night|heat|cold|heavy|danger|dirty|drunk|overtime|chaos|short.?staffed|argument/gi,
        precise: /accurate|accuracy|mistake|error|number|count|check|inspect|quality|careful|detail|quiet|alone|missed|miss |off by/gi
      }
    };

    function countHits(text, rx) {
      if (!text) { return 0; }
      rx.lastIndex = 0;
      var m = text.match(rx);
      return m ? m.length : 0;
    }

    /* =========================================================
       言語データ
       ========================================================= */
    var DATA = {};

    DATA.ja = {
      htmlLang: "ja",
      docTitle: "見えなかった仕事を言葉にする診断",
      toggleLabel: "English",
      mastTitle: "見えなかった仕事を言葉にする診断",
      mastMeta: "試作版 / 回答はこのブラウザ内だけで扱います",
      heroH1: "資格がなくても、<br>通ってきた現場は<br>消えない。",
      heroLead: "これは性格を判定する診断ではありません。あなたが実際に繰り返してきたこと、耐えてきたこと、当たり前にやってきたことを聞き出して、人に説明できる言葉へ翻訳するための8つの質問です。",
      heroStamp: "答えにない実績は作りません。<br>根拠のない褒め言葉も使いません。",
      flowLabel: "記録をたどる",
      stepName: "ひとつずつ、具体的な場面を思い出してください。",
      fieldHint: "短くてもかまいません。思い出せる事実を書いてください。",
      back: "前の質問へ",
      next: "次の質問へ",
      finish: "結果を読む",
      flowNote: "この試作は外部AIやサーバーへ回答を送信しません。結果は、入力内容をもとにこのブラウザの中だけで組み立てています。",
      questionCounter: function (n, total) { return "質問 " + n + " / " + total; },
      charCounter: function (n) { return n + " / 800"; },
      extraPlaceholder: "では、実際はどうでしたか。自分の言葉で書いてください。",
      vMinText: function (min) { return min + "文字以上で、思い出せる場面を少しだけ書いてください。"; },
      vPick: "ひとつ選んでください。",
      vExtra: "実際はどうだったかを、ひと言だけ書いてください。",

      resultEyebrow: "あなたの診断結果",
      resultTitle: "あなたが資格の代わりに持っているもの",
      resultLead: "これは診断名ではありません。あなた自身が書いた事実から、そこまで言えることだけを書いています。",

      powerHead: "1. 資格の代わりにあなたが持つ3つの現場力",
      powerLead: "履歴書の資格欄には書けませんが、仕事を渡す側が実際に見ているのはここです。3つとも、あなたが書いた事実から出しています。",

    };
    ["daily", "endure", "code", "unfair", "flaw"].forEach(function (k) { state.text[k] = ""; });

    function T() { return DATA[lang]; }
    function STEPS() { return T().steps; }

    function readLang() {
      try {
        var saved = window.localStorage.getItem("had-lang");
        if (saved === "ja" || saved === "en") { return saved; }
      } catch (e) { /* 使えない環境では既定のまま */ }
      var q = (window.location.search || "").match(/[?&]lang=(ja|en)/);
      if (q) { return q[1]; }
      var nav = (navigator.language || "").toLowerCase();
      return nav.indexOf("ja") === 0 ? "ja" : "en";
    }
    function saveLang(v) {
      try { window.localStorage.setItem("had-lang", v); } catch (e) { /* 保存できなくても動く */ }
    }

    /* =========================================================
       集計
       ========================================================= */
    function computeScores() {
      var s = { needed: 0, control: 0, endure: 0, arrange: 0, rough: 0, precise: 0 };
      var lex = LEX[lang];
      var texts = [state.text.daily, state.text.endure, state.text.code, state.text.unfair, state.mirrorExtra];
      texts.forEach(function (t) {
        if (!t) { return; }
        Object.keys(lex).forEach(function (k) { s[k] += countHits(t, lex[k]); });
      });

      if (state.text.endure) { s.endure += 2; }
      if (state.text.unfair) { s.rough += 1; }

      T().mirrorCards.forEach(function (c) {
        if (c.v === state.choice.mirror) {
          Object.keys(c.score).forEach(function (k) { s[k] += c.score[k]; });
        }
      });

      if (state.choice.pain === "a") { s.needed += 3; }
      if (state.choice.pain === "b") { s.control += 3; }
      if (state.choice.tool === "pc") { s.precise += 3; }
      if (state.choice.tool === "hands") { s.rough += 2; s.endure += 1; }
      if (state.choice.tool === "people") { s.needed += 3; }

      return s;
    }

    function axes() {
      var s = computeScores();
      var a = {
        source: s.needed >= s.control ? "needed" : "control",
        style: s.endure > s.arrange ? "endure" : "arrange",
        field: s.rough >= s.precise ? "rough" : "precise"
      };
      if (state.flip.source) { a.source = a.source === "needed" ? "control" : "needed"; }
      if (state.flip.style) { a.style = a.style === "endure" ? "arrange" : "endure"; }
      if (state.flip.field) { a.field = a.field === "rough" ? "precise" : "rough"; }
      return a;
    }

    function orderedMirrorCards() {
      var t = state.text.daily || "";
      var lex = LEX[lang];
      var scored = T().mirrorCards.map(function (c) {
        var n = 0;
        c.key.forEach(function (k) { n += countHits(t, lex[k]); });
        return { card: c, n: n };
      });
      scored.sort(function (a, b) { return b.n - a.n; });
      return scored.map(function (x) { return x.card; });
    }

    /* =========================================================
       文字まわり
       ========================================================= */
    function escapeHtml(t) {
      return String(t).replace(/[&<>'"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c];
      });
    }
    function clip(t, n) {
      var s = String(t || "").trim().replace(/\s+/g, " ");
      return s.length > n ? s.slice(0, n) + "..." : s;
    }
    // 文章に差し込む用。最初の一文だけを取り、長すぎるときは読点で切る
    function firstSentence(t, max) {
      var ja = lang === "ja";
      var s = String(t || "").trim().replace(/\s+/g, " ");
      var sep = ja ? "。" : ".";
      var i = s.indexOf(sep);
      if (i > 0) { s = s.slice(0, i); }
      var limit = ja ? max : Math.round(max * 2.2);
      if (s.length > limit) {
        var cut = s.slice(0, limit);
        var j = cut.lastIndexOf(ja ? "、" : ",");
        s = j > limit * 0.4 ? cut.slice(0, j) : cut;
      }
      return ja ? s.replace(/[、。\s]+$/, "") : s.replace(/[,.\s]+$/, "");
    }

    /* =========================================================
       静的な文言の反映
       ========================================================= */
    function applyStaticText() {
      var t = T();
      document.documentElement.setAttribute("lang", t.htmlLang);
      document.title = t.docTitle;
      byId("langToggle").textContent = t.toggleLabel;
      byId("mastTitle").textContent = t.mastTitle;
      byId("mastMeta").textContent = t.mastMeta;
      byId("page-title").innerHTML = t.heroH1;
      byId("heroLead").textContent = t.heroLead;
      byId("heroStamp").innerHTML = t.heroStamp;
      byId("flowLabel").textContent = t.flowLabel;
      byId("stepName").textContent = t.stepName;
      byId("fieldHint").textContent = t.fieldHint;
      byId("backButton").textContent = t.back;
      byId("flowNote").textContent = t.flowNote;
      byId("extraText").placeholder = t.extraPlaceholder;

      byId("resultEyebrow").textContent = t.resultEyebrow;
      byId("resultTitle").textContent = t.resultTitle;
      byId("resultLead").textContent = t.resultLead;
      byId("powerHead").textContent = t.powerHead;
      byId("powerLead").textContent = t.powerLead;
      byId("flipSource").textContent = t.flip.source;
      byId("flipStyle").textContent = t.flip.style;
      byId("flipField").textContent = t.flip.field;
      byId("reframeHead").textContent = t.reframeHead;
      byId("reframeLead").textContent = t.reframeLead;
      byId("reframeBeforeLabel").textContent = t.reframeBeforeLabel;
      byId("reframeAfterLabel").textContent = t.reframeAfterLabel;
      byId("switchHead").textContent = t.switchHead;
      byId("switchLead").textContent = t.switchLead;
      byId("copyHead").textContent = t.copyHead;
      byId("copyLead").textContent = t.copyLead;
      byId("copyApplyLabel").textContent = t.copyApplyLabel;
      byId("copyProfileLabel").textContent = t.copyProfileLabel;
      byId("actionHead").textContent = t.actionHead;
      byId("actionLead").textContent = t.actionLead;
      byId("actionTimeLabel").textContent = t.actionTimeLabel;
      byId("draftLead").textContent = t.draftLead;
      byId("draftLabel").textContent = t.draftLabel;
      byId("promptTitle").textContent = t.promptTitle;
      byId("promptLead").textContent = t.promptLead;
      byId("copyButton").textContent = t.promptCopy;
      byId("privacyNote").textContent = t.privacyNote;
      byId("editButton").textContent = t.edit;
      byId("restartButton").textContent = t.restart;

      Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function (btn) {
        btn.textContent = btn.getAttribute("data-copy") === "draftBody" ? t.draftCopyLabel : t.copyButtonLabel;
      });

      var sel = byId("actionTime");
      var keepIndex = sel.selectedIndex >= 0 ? sel.selectedIndex : t.defaultTimeIndex;
      sel.innerHTML = t.times.map(function (x) { return '<option value="' + escapeHtml(x) + '">' + escapeHtml(x) + "</option>"; }).join("");
      sel.selectedIndex = keepIndex;
    }

    /* =========================================================
       質問の表示
       ========================================================= */
    function renderStep() {
      var t = T();
      var steps = STEPS();
      var s = steps[state.step];
      byId("questionNumber").textContent = t.questionCounter(state.step + 1, steps.length);
      byId("questionText").textContent = s.q;
      byId("questionHelp").textContent = s.h;
      byId("validation").textContent = "";
      byId("backButton").style.visibility = state.step === 0 ? "hidden" : "visible";
      byId("nextButton").textContent = state.step === steps.length - 1 ? t.finish : t.next;
      byId("progress").innerHTML = steps.map(function (_, i) {
        return '<span class="' + (i <= state.step ? "active" : "") + '"></span>';
      }).join("");

      var isText = s.type === "text";
      byId("textPane").hidden = !isText;
      byId("choicePane").hidden = isText;

      if (isText) {
        var ta = byId("answer");
        ta.value = state.text[s.id] || "";
        ta.placeholder = s.p || "";
        byId("charCount").textContent = t.charCounter(ta.value.length);
        ta.focus();
      } else {
        renderOptions(s);
      }
    }

    function renderOptions(s) {
      var t = T();
      var list = byId("optionList");
      var extra = byId("optionExtra");
      var html = "";

      if (s.type === "mirror") {
        if (!state.mirrorOrder) { state.mirrorOrder = orderedMirrorCards().map(function (c) { return c.v; }); }
        state.mirrorOrder.forEach(function (v) {
          var card = null;
          t.mirrorCards.forEach(function (c) { if (c.v === v) { card = c; } });
          if (!card) { return; }
          var sel = state.choice.mirror === card.v ? " selected" : "";
          html += '<button type="button" class="option' + sel + '" data-v="' + card.v + '"><b>' + escapeHtml(card.t) + "</b><span>" + escapeHtml(card.d) + "</span></button>";
        });
        var selNone = state.choice.mirror === "none" ? " selected" : "";
        html += '<button type="button" class="option' + selNone + '" data-v="none"><b>' + escapeHtml(t.mirrorNone.t) + "</b><span>" + escapeHtml(t.mirrorNone.d) + "</span></button>";
        extra.classList.toggle("hidden", state.choice.mirror !== "none");
        byId("extraText").value = state.mirrorExtra;
      } else {
        s.options.forEach(function (o) {
          var sel = state.choice[s.id] === o.v ? " selected" : "";
          html += '<button type="button" class="option' + sel + '" data-v="' + o.v + '"><b>' + escapeHtml(o.t) + "</b><span>" + escapeHtml(o.d) + "</span></button>";
        });
        extra.classList.add("hidden");
      }
      list.innerHTML = html;

      Array.prototype.forEach.call(list.querySelectorAll(".option"), function (btn) {
        btn.addEventListener("click", function () {
          state.choice[s.id] = btn.getAttribute("data-v");
          byId("validation").textContent = "";
          renderOptions(s);
        });
      });
    }

    function validateStep() {
      var t = T();
      var s = STEPS()[state.step];
      if (s.type === "text") {
        state.text[s.id] = byId("answer").value.trim();
        if (state.text[s.id].length < s.min) {
          byId("validation").textContent = t.vMinText(s.min);
          return false;
        }
        if (s.id === "daily") { state.mirrorOrder = null; }
        return true;
      }
      if (!state.choice[s.id]) {
        byId("validation").textContent = t.vPick;
        return false;
      }
      if (s.type === "mirror") {
        state.mirrorExtra = byId("extraText").value.trim();
        if (state.choice.mirror === "none" && state.mirrorExtra.length < (lang === "ja" ? 8 : 16)) {
          byId("validation").textContent = t.vExtra;
          return false;
        }
      }
      return true;
    }

    function saveCurrentQuiet() {
      var s = STEPS()[state.step];
      if (s.type === "text") { state.text[s.id] = byId("answer").value.trim(); }
      if (s.type === "mirror") { state.mirrorExtra = byId("extraText").value.trim(); }
    }

    /* =========================================================
       結果
       ========================================================= */
    function answerBundle() {
      return {
        daily: firstSentence(state.text.daily, 70),
        dailyShort: firstSentence(state.text.daily, 60),
        endure: firstSentence(state.text.endure, 60),
        code: firstSentence(state.text.code, 50),
        codeShort: firstSentence(state.text.code, 40),
        rawDaily: state.text.daily,
        rawEndure: state.text.endure,
        rawCode: state.text.code,
        rawUnfair: state.text.unfair,
        rawFlaw: state.text.flaw,
        mirrorExtra: state.mirrorExtra,
        pain: state.choice.pain,
        tool: state.choice.tool
      };
    }

    function reframeFor(text) {
      var t = T();
      for (var i = 0; i < t.reframes.length; i++) {
        if (t.reframes[i].rx.test(text)) { return t.reframes[i]; }
      }
      return t.reframeDefault;
    }

    function renderResult() {
      var t = T();
      var ax = axes();
      var a = answerBundle();
      var P = t.power;
      var keySwitch = ax.source + "|" + ax.style;

      var mirrorLabel = "";
      var mirrorPhrase = "";
      if (state.choice.mirror === "none") {
        mirrorLabel = t.mirrorNoneLabel(clip(state.mirrorExtra, 40));
        mirrorPhrase = t.mirrorNonePhrase;
      } else {
        t.mirrorCards.forEach(function (c) {
          if (c.v === state.choice.mirror) { mirrorLabel = c.t; mirrorPhrase = t.mirrorPhrase(c.t); }
        });
      }

      var basisText = {
        needed: state.text.daily,
        control: state.text.code,
        endure: state.text.endure,
        arrange: state.text.daily,
        rough: state.text.unfair,
        precise: state.text.code
      };

      byId("powerList").innerHTML = [ax.source, ax.style, ax.field].map(function (k, i) {
        var d = P[k];
        var src = basisText[k] || state.text.daily;
        return '<div class="power-card"><h4>' + (i + 1) + ". " + escapeHtml(d.h) + "</h4><p>" + escapeHtml(d.p) + '</p><span class="basis"><b>'
          + escapeHtml(t.basisLabel(t.basisLabels[k])) + "</b><br>" + escapeHtml(t.quote(clip(src, 120))) + "</span></div>";
      }).join("");

      byId("recheckText").textContent = t.recheck(mirrorPhrase);

      var rf = reframeFor(state.text.flaw);
      byId("reframeBefore").textContent = t.quote(state.text.flaw);
      byId("reframeAfter").textContent = rf.after;
      byId("reframeTail").textContent = rf.tail;

      byId("switchOn").innerHTML = "<b>" + escapeHtml(t.switchOnLabel) + "</b>" + escapeHtml(t.switchOn[keySwitch]);
      byId("switchOff").innerHTML = "<b>" + escapeHtml(t.switchOffLabel) + "</b>" + escapeHtml(t.switchOff[keySwitch]);

      byId("copyApply").textContent = t.applyCopy(a, ax, P);
      byId("copyProfile").textContent = t.profileCopy(a, ax, P);

      renderActions();
      byId("promptOutput").value = t.prompt(a, ax, P, mirrorLabel, rf);
    }

    function renderActions() {
      var t = T();
      var list = t.actions[state.choice.tool || "unsure"];
      byId("actionList").innerHTML = list.map(function (a) {
        var sel = state.action === a.v ? " selected" : "";
        return '<button type="button" class="option' + sel + '" data-a="' + a.v + '"><b>' + escapeHtml(a.t) + "</b><span>" + escapeHtml(a.d) + "</span></button>";
      }).join("");

      Array.prototype.forEach.call(byId("actionList").querySelectorAll(".option"), function (btn) {
        btn.addEventListener("click", function () {
          state.action = btn.getAttribute("data-a");
          renderActions();
          renderPledge();
        });
      });
      renderPledge();
    }

    function renderPledge() {
      var t = T();
      var pledge = byId("pledge");
      var draftBox = byId("draftBox");
      if (!state.action) {
        pledge.classList.add("hidden");
        draftBox.classList.add("hidden");
        return;
      }
      var list = t.actions[state.choice.tool || "unsure"];
      var found = null;
      list.forEach(function (a) { if (a.v === state.action) { found = a; } });
      if (!found) {
        pledge.classList.add("hidden");
        draftBox.classList.add("hidden");
        return;
      }

      var tomorrow = new Date(Date.now() + 86400000);
      pledge.textContent = t.pledge(t.dateLabel(tomorrow), byId("actionTime").value, found.t);
      pledge.classList.remove("hidden");

      var draft = t.drafts[state.action];
      if (draft) {
        byId("draftBody").textContent = draft(axes(), t.toolWords[state.choice.tool || "unsure"]);
        draftBox.classList.remove("hidden");
      } else {
        draftBox.classList.add("hidden");
      }
    }

    function resultVisible() { return byId("result").classList.contains("visible"); }

    function showResult() {
      renderResult();
      byId("formFlow").classList.add("hidden");
      byId("result").classList.add("visible");
      byId("result").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    /* =========================================================
       言語切り替え
       ========================================================= */
    function switchLang() {
      saveCurrentQuiet();
      lang = lang === "ja" ? "en" : "ja";
      saveLang(lang);
      state.mirrorOrder = null;
      applyStaticText();
      if (resultVisible()) { renderResult(); } else { renderStep(); }
    }

    /* =========================================================
       イベント
       ========================================================= */
    byId("langToggle").addEventListener("click", switchLang);
    byId("answer").addEventListener("input", function () {
      byId("charCount").textContent = T().charCounter(byId("answer").value.length);
    });
    byId("extraText").addEventListener("input", function () {
      state.mirrorExtra = byId("extraText").value;
    });
    byId("nextButton").addEventListener("click", function () {
      if (!validateStep()) { return; }
      if (state.step === STEPS().length - 1) { showResult(); return; }
      state.step += 1;
      renderStep();
    });
    byId("backButton").addEventListener("click", function () {
      saveCurrentQuiet();
      if (state.step > 0) { state.step -= 1; renderStep(); }
    });
    byId("editButton").addEventListener("click", function () {
      // 最後の質問だけ出ると直しにくいので、1問目から見直す（回答は残したまま）
      state.step = 0;
      byId("result").classList.remove("visible");
      byId("formFlow").classList.remove("hidden");
      renderStep();
      byId("formFlow").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    byId("restartButton").addEventListener("click", function () {
      state.step = 0;
      state.choice = {};
      state.mirrorExtra = "";
      state.flip = { source: false, style: false, field: false };
      state.action = null;
      state.mirrorOrder = null;
      Object.keys(state.text).forEach(function (k) { state.text[k] = ""; });
      byId("result").classList.remove("visible");
      byId("formFlow").classList.remove("hidden");
      renderStep();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    byId("flipSource").addEventListener("click", function () { state.flip.source = !state.flip.source; renderResult(); });
    byId("flipStyle").addEventListener("click", function () { state.flip.style = !state.flip.style; renderResult(); });
    byId("flipField").addEventListener("click", function () { state.flip.field = !state.flip.field; renderResult(); });
    byId("actionTime").addEventListener("change", renderPledge);

    Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function (btn) {
      btn.addEventListener("click", function () {
        copyText(byId(btn.getAttribute("data-copy")).textContent, byId("toastCopy"));
      });
    });
    byId("copyButton").addEventListener("click", function () {
      copyText(byId("promptOutput").value, byId("toast"));
    });

    function copyText(text, toastEl) {
      var t = T();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          toastEl.textContent = t.copied;
        }, function () {
          toastEl.textContent = t.copyFailed;
        });
      } else {
        toastEl.textContent = t.copyFailed;
      }
    }

    /* 起動 */
    lang = readLang();
    applyStaticText();
    renderStep();
  })();
  </script>
</body>
</html>
